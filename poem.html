<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mengarahkan... — Roderikus Poetry</title>
  <script>
    // Redirect old poem.html?id=X URL paths to the new SPA router at index.html?id=X
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) {
      window.location.replace('./?id=' + id);
    } else {
      window.location.replace('./');
    }
  </script>
</head>
<body>
  <div style="font-family:sans-serif; text-align:center; padding:50px 20px; color:#e0d8ec; background-color:#13101e; height:100vh; box-sizing:border-box;">
    <p style="font-size:1.2rem; opacity:0.8;">Mengarahkan ke halaman puisi...</p>
  </div>
</body>
</html>
