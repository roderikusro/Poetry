<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Baca puisi lengkap dengan musik latar yang menenangkan">
  <title>🌸 Roderikus Poem — Membaca Puisi</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Floating Decorations -->
  <div class="floating-decorations">
    <span class="floating-item">🌸</span>
    <span class="floating-item">✨</span>
    <span class="floating-item">🦋</span>
    <span class="floating-item">💫</span>
    <span class="floating-item">🌷</span>
    <span class="floating-item">🍃</span>
    <span class="floating-item">💖</span>
    <span class="floating-item">⭐</span>
  </div>

  <!-- Back Navigation -->
  <nav class="poem-nav" id="poemNav">
    <a href="index.html" class="back-btn" id="backBtn">
      <span class="back-arrow">←</span>
      <span>Kembali</span>
    </a>
  </nav>

  <!-- Poem Content -->
  <main class="poem-page" id="poemPage">
    <div class="poem-page-header" id="poemHeader">
      <!-- Filled by JS -->
    </div>
    <div class="poem-page-body" id="poemBody">
      <!-- Filled by JS -->
    </div>
    <div class="poem-page-footer" id="poemFooter">
      <!-- Filled by JS -->
    </div>
  </main>

  <!-- Song Selector Popup -->
  <div class="song-selector" id="songSelector">
    <h3>🎵 Pilih Lagu</h3>
    <ul class="song-list" id="songList"></ul>
  </div>

  <!-- Music Player -->
  <div class="music-player" id="musicPlayer">
    <div class="player-artwork" id="playerArtwork">🎵</div>
    <div class="player-info">
      <div class="player-song-title" id="songTitle">Pilih lagu...</div>
      <div class="player-artist" id="songArtist">Tap ▶ untuk memulai</div>
      <div class="player-progress-bar" id="progressBar">
        <div class="player-progress-fill" id="progressFill"></div>
      </div>
      <div class="player-time">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn small-btn" id="prevBtn" aria-label="Sebelumnya" onclick="prevSong()">⏮</button>
      <button class="player-btn play-btn" id="playBtn" aria-label="Play" onclick="togglePlay()">▶</button>
      <button class="player-btn small-btn" id="nextBtn" aria-label="Selanjutnya" onclick="nextSong()">⏭</button>
      <button class="player-btn small-btn" id="listBtn" aria-label="Daftar Lagu" onclick="toggleSongList()">☰</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer" style="padding-bottom: 120px;">
    <p>Dibuat dengan <span>♥</span> untuk pecinta puisi</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>

</html>
