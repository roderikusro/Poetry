<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Baca puisi lengkap dengan musik latar yang menenangkan">
  <title>🪶 Roderikus Poetry — Membaca Puisi</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Caveat:wght@400;700&family=Dancing+Script:wght@400&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Floating Decorations -->
  <div class="floating-decorations">
    <span class="floating-item">🌙</span>
    <span class="floating-item">⭐</span>
    <span class="floating-item">🧭</span>
    <span class="floating-item">✦</span>
    <span class="floating-item">🪶</span>
    <span class="floating-item">🍂</span>
    <span class="floating-item">🏔️</span>
    <span class="floating-item">✧</span>
  </div>

  <!-- Back Navigation -->
  <nav class="poem-nav" id="poemNav">
    <a href="index.html" class="back-btn" id="backBtn">
      <span class="back-arrow">←</span>
      <span>Kembali</span>
    </a>
  </nav>

  <!-- Poem Content -->
  <main class="poem-page" id="poemPage">
    <div class="poem-page-header" id="poemHeader">
      <!-- Filled by JS -->
    </div>
    <div class="poem-page-body" id="poemBody">
      <!-- Filled by JS -->
    </div>
    <div class="poem-page-footer" id="poemFooter">
      <!-- Filled by JS -->
    </div>
  </main>

  <!-- Hidden YouTube Player -->
  <div id="ytContainer" style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;overflow:hidden;">
    <div id="ytPlayer"></div>
  </div>

  <!-- Music Player -->
  <div class="music-player" id="musicPlayer">
    <div class="player-artwork" id="playerArtwork">🎵</div>
    <div class="player-info">
      <div class="player-song-title" id="songTitle">Memuat lagu...</div>
      <div class="player-artist" id="songArtist">Tap ▶ untuk memulai</div>
      <div class="player-progress-bar" id="progressBar">
        <div class="player-progress-fill" id="progressFill"></div>
      </div>
      <div class="player-time">
        <span id="currentTime">0:00</span>
        <span id="totalTime">0:00</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="player-btn play-btn" id="playBtn" aria-label="Play" onclick="togglePlay()">▶</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer" style="padding-bottom: 120px;">
    <p>Dibuat dengan <span>♥</span> untuk pecinta puisi</p>
  </footer>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="data.js" defer></script>
  <script src="script.js" defer></script>
</body>

</html>
