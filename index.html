<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Roderikus Poem — Kumpulan puisi indah untuk jiwa yang rindu keindahan kata">
  <title>🪶 Roderikus Poem — Ruang Kata yang Indah</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Floating Decorations -->
  <div class="floating-decorations">
    <span class="floating-item">🌙</span>
    <span class="floating-item">⭐</span>
    <span class="floating-item">🧭</span>
    <span class="floating-item">✦</span>
    <span class="floating-item">🪶</span>
    <span class="floating-item">🍂</span>
    <span class="floating-item">🏔️</span>
    <span class="floating-item">✧</span>
  </div>

  <!-- Header -->
  <header class="header" id="header">
    <div class="header-icon">🪶</div>
    <h1>Roderikus Poem</h1>
    <p>Ruang kecil untuk kata-kata yang bermakna</p>
    <div class="header-divider"></div>
  </header>

  <!-- Sort & Filter Bar -->
  <div class="container">
    <div class="home-toolbar" id="homeToolbar">
      <div class="toolbar-left">
        <span class="toolbar-label">📚 Semua Puisi</span>
        <span class="poem-count" id="poemCount"></span>
      </div>
      <div class="toolbar-right">
        <div class="toolbar-group">
          <button class="sort-btn active" id="sortNewBtn" onclick="sortPoems('newest')">
            🕐 Terbaru
          </button>
          <button class="sort-btn" id="sortOldBtn" onclick="sortPoems('oldest')">
            📅 Terlama
          </button>
        </div>
        <div class="toolbar-divider"></div>
        <div class="toolbar-group">
          <button class="view-btn active" id="viewListBtn" onclick="setView('list')" title="Tampilan daftar">
            ☰
          </button>
          <button class="view-btn" id="viewGridBtn" onclick="setView('grid')" title="Tampilan grid">
            ▦
          </button>
        </div>
      </div>
    </div>

    <!-- Poem List -->
    <div class="poem-list" id="poemList"></div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>Dibuat dengan <span>♥</span> untuk pecinta puisi</p>
    <a href="admin.html" class="footer-admin-link">🔐 Admin</a>
  </footer>

  <script src="data.js"></script>
  <script src="home.js"></script>
</body>

</html>
